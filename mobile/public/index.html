<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101315" />
    <meta
      name="description"
      content="Drevos: Deinen Räucherofen zuhause und unterwegs bedienen. Mit privater Kopplung und verschlüsselter Verbindung."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Drevos" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Drevos · Web-App</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #101315;
      }
      body {
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      #root {
        display: flex;
        flex: 1;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid #ffad62;
        outline-offset: 3px;
      }
    </style>
    <script src="/register-sw.js" defer></script>
  </head>
  <body>
    <noscript
      >Bitte JavaScript aktivieren, um Drevos zu verwenden. / Please enable
      JavaScript to use Drevos.</noscript
    >
    <div id="root"></div>
  </body>
</html>
