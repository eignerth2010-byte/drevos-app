name: Drevos App

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Compile the unsigned iPhone app on a hosted Mac
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'
  WRANGLER_SEND_METRICS: 'false'
  CI: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Pi installer syntax
        run: |
          sh -n scripts/install-gateway.sh
          sh -n scripts/install-cloud.sh
      - run: python -m pip install . ./cloud_agent pytest
      - run: python -m pytest tests -q
      - run: python -m unittest discover -s cloud_agent/tests -v
      - run: npm ci
        working-directory: cloud
      - run: npm run check && npm run build && npm test
        working-directory: cloud
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run format:check && npm test && npm run bundle:check && npm run build:web
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Drevos-Installable-Web-App
          path: mobile/dist-web
          retention-days: 14

  android:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Drevos-Standalone-Android-preview-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform ios
        working-directory: mobile
      - name: Compile unsigned iPhone app
        run: xcodebuild -workspace ios/Drevos.xcworkspace -scheme Drevos -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
        working-directory: mobile
      - name: Package unsigned app
        run: |
          mkdir -p unsigned/Payload
          cp -R build/Build/Products/Release-iphoneos/Drevos.app unsigned/Payload/
          cd unsigned
          zip -qr ../Drevos-iPhone-UNSIGNED.ipa Payload
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Drevos-Standalone-iPhone-UNSIGNED
          path: mobile/Drevos-iPhone-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
